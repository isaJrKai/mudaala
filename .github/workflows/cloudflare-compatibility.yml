name: Cloudflare Workers compatibility check

on:
  push:
    branches:
      - cloudflare-workers-test
  pull_request:
    branches:
      - main
      - cloudflare-workers-test
  workflow_dispatch:

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Cloudflare vinext compatibility check
        run: npx vinext check
