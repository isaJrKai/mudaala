# Mudaala CI — types, lint, and the API behavior suite on every push.
#
# The test suite (scripts/test-api.ts) talks to a RUNNING dev server over
# HTTP, so the job boots one against a fresh PostgreSQL database — the same
# engine the app runs on since Task 5 (schema.prisma: provider = "postgresql").
# A postgres:16 service container IS that database; DATABASE_URL points at it.
# (This workflow spent months in the SQLite era — every run since the Task-5
# move died in seconds at the database step with P1012, because Prisma rightly
# refused a file: URL against a postgresql schema.)
#
# The env block mirrors .env.example: AUTH_BEARER_FALLBACK=1 stands in for the
# preview/sandbox environment the Bearer channel exists for; ADMIN_PHONES
# picks a seeded fixture phone as the deployment admin.
#
# The runner is PINNED to ubuntu-22.04: GitHub's ubuntu-latest label moved to
# 24.04 in October — a mid-sprint OS bump must never change the floor under
# the suite. Revisit the pin deliberately, never by surprise.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mudaala
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mudaala"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mudaala
      # schema.prisma's datasource declares directUrl = env("DIRECT_URL");
      # Prisma CLI (db push / migrate) refuses to run without it. CI points it
      # at the same postgres:16 service container — no production credentials.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mudaala
      AUTH_BEARER_FALLBACK: "1"
      CRON_SECRET: ci-cron-secret
      SETTINGS_ENC_KEY: ci-settings-enc-key
      ADMIN_PHONES: "+256712000001"
      CSRF_TRUSTED_HOSTS: ".preview-platform.example"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create database schema
        run: bunx prisma db push --skip-generate --accept-data-loss

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Seed development fixtures
        run: bunx tsx scripts/seed.ts

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Start dev server
        run: |
          bun run dev &
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/listings || true)
            if [ "$code" = "200" ]; then echo "server up"; exit 0; fi
          done
          echo "server did not come up"; exit 1

      - name: API behavior suite
        run: bunx tsx scripts/test-api.ts

      - name: Clean test data
        if: always()
        run: bunx tsx scripts/cleanup-test-data.ts
