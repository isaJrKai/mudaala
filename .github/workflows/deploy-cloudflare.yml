name: Legacy Cloudflare deploy (disabled)

# Production deploys are owned by isaJrKai/mudaala-cloudflare.
# This workflow is intentionally a no-op to prevent two repositories from
# deploying different code to the same Cloudflare Worker. The file remains
# here for auditability; do not add a deploy step back without changing the
# single-source-of-truth decision first.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled legacy deployment
        run: echo "No deployment performed. Use isaJrKai/mudaala-cloudflare for production."
